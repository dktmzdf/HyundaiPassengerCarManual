[build-system]
requires = ["setuptools==65.5.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avante-manual-rag"
version = "0.1.0"
description = "Local manual processing and OpenAI-backed vehicle-scoped RAG"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pdfplumber==0.11.10", "openai==3.26.0", "faiss-cpu==1.15.1",
  "numpy==2.4.6", "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "reportlab==5.0.1", "build==1.6.1"]

[project.scripts]
avante-rag = "avante_manual_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["avante_manual_rag*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
